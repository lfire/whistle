<text x="72" y="720" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#173a35" text-anchor="start" font-weight="normal">· 22s PING / PONG 心跳保活</text>
<text x="72" y="756" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#173a35" text-anchor="start" font-weight="normal">· MAX_PAYLOAD = 1MB 超长帧截断</text>
<text x="72" y="792" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#173a35" text-anchor="start" font-weight="normal">· MAX_COMPOSE_FRAME_COUNT = 5 组合帧上限</text>
<text x="72" y="828" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#173a35" text-anchor="start" font-weight="normal">· conns[reqId] 保存每连接上下文</text>
<text x="760" y="720" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#173a35" text-anchor="start" font-weight="normal">· handleClose 时清理 conns 与计时器</text>
<text x="760" y="756" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#173a35" text-anchor="start" font-weight="normal">· UI 可 changeStatus / sendData / abort 反向控制</text>
<text x="760" y="792" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#173a35" text-anchor="start" font-weight="normal">· frameScript 改写后交给 getSender 重新编码</text>
<text x="760" y="828" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#173a35" text-anchor="start" font-weight="normal">· 帧同时进入 framesCache 供 Network 面板读取</text>
