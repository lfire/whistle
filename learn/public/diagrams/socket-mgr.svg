<text x="1006" y="219" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#52706c" text-anchor="start" font-weight="normal">reqSocket.pipe(socket).pipe(reqSocket)</text>
<text x="1006" y="242" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#52706c" text-anchor="start" font-weight="normal">hagent 起本地 TLS server 解密</text>
<text x="1006" y="265" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#52706c" text-anchor="start" font-weight="normal">明文交给 inspectors 后再拼接</text>
<text x="1006" y="288" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#52706c" text-anchor="start" font-weight="normal">用于 HTTPS / WSS 需解密的场景</text>
